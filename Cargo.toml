[workspace]
members = ["infront-engine", "infront-vllm", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pegainfer-project/infront"
version = "0.1.0"

[workspace.dependencies]
infront-engine = { path = "infront-engine" }

anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5"
futures = "0.3"
http-body-util = "0.1.3"
log = "0.4"
rmp-serde = "1.3"
rmpv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
zeromq = { git = "https://github.com/zeromq/zmq.rs", rev = "67dcba97559ebe8e8206dab753710d8b9cb07591", default-features = false, features = [
  "tokio-runtime",
  "all-transport",
] }

# vLLM's Rust frontend. Keep every crate on the same rev.
vllm-chat = { git = "https://github.com/vllm-project/vllm.git", rev = "fce64bc5c2c939a4521bfb9b462c8c74c1c13893" }
vllm-engine-core-client = { git = "https://github.com/vllm-project/vllm.git", rev = "fce64bc5c2c939a4521bfb9b462c8c74c1c13893" }
vllm-server = { git = "https://github.com/vllm-project/vllm.git", rev = "fce64bc5c2c939a4521bfb9b462c8c74c1c13893" }
vllm-text = { git = "https://github.com/vllm-project/vllm.git", rev = "fce64bc5c2c939a4521bfb9b462c8c74c1c13893" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
doc_markdown = "allow"
implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
upper_case_acronyms = "allow"
redundant_clone = "warn"
unused_peekable = "warn"
dbg_macro = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
