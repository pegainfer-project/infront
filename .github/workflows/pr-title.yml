name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert): [^ ]'
          [[ "$TITLE" =~ $pattern ]] || {
            echo "::error::PR title must be '<type>: <description>' without a scope; see AGENTS.md"
            exit 1
          }
