[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "unmaintained, no vulnerability; paste is a proc macro, compile time only" },
  { id = "RUSTSEC-2026-0249", reason = "unmaintained, no vulnerability; smartstring backs serde-json-fmt in vllm-chat" },
  { id = "RUSTSEC-2026-0391", reason = "unreachable: affects Encoder/Decoder::with_context; zstd's only caller, oss-harmony, uses decode_all" },
  { id = "RUSTSEC-2026-0398", reason = "unreachable: affects Seekable, and the seekable feature is off" },
  { id = "RUSTSEC-2026-0403", reason = "unreachable: affects write::Decoder; oss-harmony uses decode_all on embedded vocab data" },
]
yanked = "deny"

[bans]
multiple-versions = "allow"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[sources]
allow-git = [
  "https://github.com/oss-harmony/harmony",
  "https://github.com/smg-project/llm-multimodal",
  "https://github.com/vllm-project/vllm",
  "https://github.com/zeromq/zmq.rs",
]
unknown-git = "deny"
unknown-registry = "deny"
